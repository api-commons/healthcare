# FHIR implementers: every provider whose matches are ALL FHIR resource paths (/Patient,
# /Observation, /Coverage...) is one voice -- the vocabulary is HL7's. Providers that publish
# FHIR alongside their own API (athenahealth, Tebra, AdvancedMD, Particle) are counted alone.
shared_specs:
  hl7-fhir: [
    aetna, amerihealth-caritas, canvas-medical, charmhealth, childrens-hospital-of-philadelphia,
    cigna, clevercarehealthplan, clover-health, cms-blue-button, community-health-systems,
    devoted-health, elevance-health, fhir, flexpa, gp-connect, health-gorilla,
    independence-blue-cross, jefferson-health, lifen, meditech, modernizing-medicine,
    nextgen-healthcare, nhs-api, oracle-health, penn-medicine, smarthealthit, sun-life,
    temple-health, tenet-healthcare, unitedhealth, unitedhealthcare, varian-medical-systems]
duplicates:
  oracle-health: [cerner]
  cdc: [cdc-gov]
  vitagroup: [ehrbase]
  junction-com: [vital-io]
  nhs-england: [nhs-api, nhs-digital]
  thatch: [thatch-health]

findings:
  - "FHIR is to healthcare what Open Banking is to banking: 32 providers in this cohort publish
    nothing but FHIR resources. Counted once as HL7's voice, the market's own agreement shows."
  - "A patient agrees on date of birth, gender, first and last name and email -- the
    demographic core every EHR, telehealth platform and payer API carries."
  - "A practitioner agrees on name, NPI and specialty: the National Provider Identifier is the
    one identifier the US market shares."
  - "Coverage agrees on the payer, the member's relationship and status, and a claim on its
    patient, practitioner, payer and date of service -- the payer side of healthcare is more
    uniform than the clinical side."
  - "Clinical records (observations, conditions, prescriptions) agree only on a code and the
    patient: the code is the vocabulary (LOINC, SNOMED, ICD-10, RxNorm), and the structure
    around it is the provider's."
decisions:
  - "Every provider that publishes only FHIR resources counts once, as `hl7-fhir`, with its own
    crosswalk. Providers with FHIR alongside a proprietary API (athenahealth, Tebra,
    AdvancedMD, Particle, the NHS and VA) are counted on their own."
  - "Appointments are the scheduling context's; health insurance -- coverage and claims -- is
    this context's, handed over from insurance."
  - "A practitioner is `/practitioners` (FHIR's word), though eight providers say `providers`:
    `/providers` means an API provider or a service provider in other contexts."
  - "A prescription covers FHIR's MedicationRequest and medication orders beneath a patient."
  - "A health claim is `/health-claims` and covers Explanation of Benefit; `/claims` is the
    insurance context's."
  - "Visits and consultations are encounters; vitals, lab results and measurements are
    observations; problems and diagnoses are conditions; eligibility checks are coverage."
  - "Duplicates merged: Cerner into Oracle Health, CDC, EHRbase into vitagroup, Vital into
    Junction, three NHS listings into NHS England, Thatch."
