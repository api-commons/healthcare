context: healthcare
name: Healthcare
intro: >-
  The common healthcare vocabulary -- patients and the practitioners who treat them, the
  encounters where care happens, the observations, conditions and prescriptions recorded,
  and the coverage and claims that pay for it -- distilled from the APIs that already exist,
  the FHIR standard included. Appointments belong to the scheduling context.
tags: [Healthcare, Digital Health, Telehealth, Health Tech, FHIR, Electronic Health Records, EHR, Health Insurance, Healthtech]

